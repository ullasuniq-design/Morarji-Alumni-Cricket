<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MCL Player Stats</title>

<style>
body{
    font-family:Arial, sans-serif;
    max-width:500px;
    margin:auto;
    padding:15px;
    background:#f5f5f5;
}

h2{
    text-align:center;
    margin-bottom:20px;
}

input{
    width:70%;
    padding:10px;
    font-size:16px;
}

button{
    padding:10px 15px;
    font-size:16px;
    cursor:pointer;
}

#result{
    margin-top:20px;
    background:white;
    padding:15px;
    border-radius:8px;
}

.row{
    display:flex;
    justify-content:space-between;
    padding:6px 0;
    border-bottom:1px solid #eee;
}

.label{
    font-weight:bold;
}

.value{
    color:#1565c0;
}

.section{
    margin-top:15px;
    font-size:18px;
    font-weight:bold;
}
</style>
</head>

<body>

<h2>Morarji School Alumni Cricket</h2>

<input id="capInput" placeholder="Enter CAP #" />
<button onclick="searchPlayer()">Search</button>

<div id="result"></div>

<script>

let playersData = [];
let statsData = [];

// Load Players CSV
fetch('players.csv')
.then(r => r.text())
.then(text => {
    playersData = csvToArray(text);
});

// Load Stats CSV
fetch('stats.csv')
.then(r => r.text())
.then(text => {
    statsData = csvToArray(text);
});

function csvToArray(str){
    const rows = str.trim().split('\n');
    const headers = rows[0].split(',');

    return rows.slice(1).map(row => {
        const values = row.split(',');
        return headers.reduce((obj, header, index) => {
            obj[header.trim()] = values[index]?.trim();
            return obj;
        }, {});
    });
}

function searchPlayer(){

    const cap = document.getElementById("capInput").value.trim();

    const player = playersData.find(
        p => p["CAP"] === cap || p["CAP #"] === cap
    );

    const stat = statsData.find(
        s => s["CAP"] === cap || s["CAP #"] === cap
    );

    if(!player){
        document.getElementById("result").innerHTML =
            "<h3>Player not found</h3>";
        return;
    }

    document.getElementById("result").innerHTML = `

        <div class="section">Player Information</div>

        <div class="row">
            <span class="label">CAP #</span>
            <span class="value">${player["CAP #"] || player["CAP"]}</span>
        </div>

        <div class="row">
            <span class="label">Player</span>
            <span class="value">${player["Player"]}</span>
        </div>

        <div class="row">
            <span class="label">Batch</span>
            <span class="value">${player["Batch"]}</span>
        </div>

        <div class="row">
            <span class="label">Season</span>
            <span class="value">${player["Played Seasons"]}</span>
        </div>

        <div class="section">Career Stats</div>

        <div class="row"><span>Matches</span><span>${stat?.Match || '-'}</span></div>
        <div class="row"><span>Innings</span><span>${stat?.Innings || '-'}</span></div>
        <div class="row"><span>Runs</span><span>${stat?.Runs || '-'}</span></div>
        <div class="row"><span>Best</span><span>${stat?.Best || '-'}</span></div>
        <div class="row"><span>Average</span><span>${stat?.Avg || '-'}</span></div>
        <div class="row"><span>4s</span><span>${stat?.Fours || '-'}</span></div>
        <div class="row"><span>6s</span><span>${stat?.Sixes || '-'}</span></div>
        <div class="row"><span>Strike Rate</span><span>${stat?.SR || '-'}</span></div>
        <div class="row"><span>Wickets</span><span>${stat?.Wickets || '-'}</span></div>
        <div class="row"><span>Overs</span><span>${stat?.Overs || '-'}</span></div>

    `;
}
</script>

</body>
</html>
``
