<!DOCTYPE html>
<html>
<head>
<title>MCL Test</title>
</head>
<body>

<h2>Player Lookup</h2>

<input id="cap">

<button onclick="findPlayer()">Search</button>

<div id="result"></div>

<script>

const players = [
  {cap:"8",name:"ULLAS"},
  {cap:"3",name:"VAIRUMUDI"}
];

function findPlayer(){

  let cap=document.getElementById("cap").value;

  let p=players.find(x=>x.cap===cap);

  if(p)
    document.getElementById("result").innerHTML=p.name;
  else
    document.getElementById("result").innerHTML="Not found";
}

</script>

</body>
</html>
