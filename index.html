<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>MCL Player Stats</title>

<style>

body{
    font-family:Arial, sans-serif;
    max-width:700px;
    margin:auto;
    background:#f5f5f5;
    padding:15px;
}

h1{
    text-align:center;
}

.search-box{
    text-align:center;
    margin:20px 0;
}

input{
    padding:10px;
    width:200px;
    font-size:16px;
}

button{
    padding:10px 15px;
    cursor:pointer;
}

.profile{
    display:flex;
    gap:15px;
    margin-bottom:20px;
}

.profile img{
    width:120px;
    height:150px;
    object-fit:cover;
    border:1px solid #ccc;
    background:#eee;
}

.details{
    flex:1;
}

.details table{
    width:100%;
    border-collapse:collapse;
}

.details td{
    padding:6px;
    border-bottom:1px solid #ddd;
}

.section{
    margin-top:25px;
}

.section h2{
    border-bottom:2px solid #333;
    padding-bottom:5px;
}

.stats-table{
    width:100%;
    border-collapse:collapse;
}

.stats-table td{
    padding:8px;
    border-bottom:1px solid #ddd;
}

.stats-table td:last-child{
    text-align:right;
    font-weight:bold;
}

</style>
</head>

<body>

<h1>Morarji School Alumni Cricket</h1>

<div class="search-box">
    <input type="number"
           id="capNumber"
           placeholder="Enter CAP Number">

    <button onclick="searchPlayer()">Search</button>
</div>

<div id="playerArea" style="display:none">

    <div class="profile">

        <img id="playerPhoto">

        <div class="details">
            <table>
                <tr><td>Cap #</td><td id="cap"></td></tr>
                <tr><td>Name</td><td id="name"></td></tr>
                <tr><td>Batch</td><td id="batch"></td></tr>
                <tr><td>Seasons</td><td id="season"></td></tr>
            </table>
        </div>

    </div>

    <div class="section">

        <h2>Total Match Summary</h2>

        <table class="stats-table">

            <tr><td>Match</td><td id="match"></td></tr>
            <tr><td>Innings</td><td id="innings"></td></tr>
            <tr><td>Runs</td><td id="runs"></td></tr>
            <tr><td>Best</td><td id="best"></td></tr>
            <tr><td>Average</td><td id="avg"></td></tr>
            <tr><td>4s</td><td id="fours"></td></tr>
            <tr><td>6s</td><td id="sixes"></td></tr>
            <tr><td>Strike Rate</td><td id="sr"></td></tr>
            <tr><td>Wickets</td><td id="wickets"></td></tr>
            <tr><td>Overs</td><td id="overs"></td></tr>
            <tr><td>Bowling Avg</td><td id="bavg"></td></tr>
            <tr><td>Best Bowling</td><td id="bb"></td></tr>
            <tr><td>Economy</td><td id="eco"></td></tr>

        </table>

    </div>

</div>

<script>

let players = [];
let stats = [];

/* Load CSV files */

Promise.all([
    fetch("players.csv").then(r => r.text()),
    fetch("stats.csv").then(r => r.text())
])
.then(([playersCSV, statsCSV]) => {

    players = csvToJSON(playersCSV);
    stats = csvToJSON(statsCSV);

    console.log("CSV Loaded");
});

function csvToJSON(csv){

    const rows = csv.trim().split("\n");
    const headers = rows[0].split(",");

    return rows.slice(1).map(row => {

        const cols = row.split(",");

        let obj = {};

        headers.forEach((h,i)=>{
            obj[h.trim()] = cols[i]?.trim();
        });

        return obj;
    });
}

function searchPlayer(){

    const cap =
        document.getElementById("capNumber").value.trim();

    const player =
        players.find(
            p => p["CAP #"] === cap
        );

    const stat =
        stats.find(
            s => s["CAP #"] === cap
        );

    if(!player){
        alert("Player not found");
        return;
    }

    document.getElementById("playerArea")
        .style.display="block";

    document.getElementById("cap").innerText =
        player["CAP #"];

    document.getElementById("name").innerText =
        player["Player"];

    document.getElementById("batch").innerText =
        player["Batch"];

    document.getElementById("season").innerText =
        player["Played Seasons"];

    document.getElementById("match").innerText =
        stat?.["Match"] || "-";

    document.getElementById("innings").innerText =
        stat?.["Innings"] || "-";

    document.getElementById("runs").innerText =
        stat?.["Runs"] || "-";

    document.getElementById("best").innerText =
        stat?.["Best"] || "-";

    document.getElementById("avg").innerText =
        stat?.["Avg"] || "-";

    document.getElementById("fours").innerText =
        stat?.["Fours"] || "-";

    document.getElementById("sixes").innerText =
        stat?.["Sixes"] || "-";

    document.getElementById("sr").innerText =
        stat?.["SR"] || "-";

    document.getElementById("wickets").innerText =
        stat?.["Wickets"] || "-";

    document.getElementById("overs").innerText =
        stat?.["Overs"] || "-";

    document.getElementById("bavg").innerText =
        stat?.["Bowling Avg"] || "-";

    document.getElementById("bb").innerText =
        stat?.["Best Bowling"] || "-";

    document.getElementById("eco").innerText =
        stat?.["Economy"] || "-";

    const photo =
        document.getElementById("playerPhoto");

    photo.src = "Photos/" + cap + ".jpg";

    photo.onerror = function(){
        this.src =
        "https://dummyimage.com/120x150/cccccc/000000&text=No+Photo";
    };
}

</script>

</body>
</html>
``
